name: Release

# Tag `app-vX.Y.Z` (X.Y.Z must equal `[workspace.package] version` in app/Cargo.toml)
# → Windows build (dist profile) → per-user setup.exe (Inno Setup) + portable zip, both
# install-tested → GitHub Release with the setup.exe, zip and SHA256SUMS.
# Manual runs (workflow_dispatch) default to a dry run: build, test, checksum, upload as a
# workflow artifact, publish nothing. PRs that touch this file or installer/ get the same
# dry run.

on:
  push:
    tags: ["app-v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "installer/**"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build + checksum only; don't publish (publishing also requires running on an app-v* tag)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned Inno Setup 6 from the official jrsoftware/issrc GitHub release; the SHA-256 is
  # checked before it runs (it matches the digest GitHub lists for the release asset).
  INNO_VERSION: 6.7.4
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
  INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c

jobs:
  build:
    name: build (windows-x86_64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and check version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo_version=$(awk '
            { sub(/\r$/, "") }
            /^\[/ { in_pkg = ($0 == "[workspace.package]") }
            in_pkg && /^version[[:space:]]*=/ { gsub(/.*=[[:space:]]*"|".*/, ""); print; exit }
          ' Cargo.toml)
          if [ -z "$cargo_version" ]; then
            echo "::error::could not read [workspace.package] version from app/Cargo.toml"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            tag_version=${REF_NAME#app-v}
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag $REF_NAME does not match app/Cargo.toml version $cargo_version"
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "Release version: $cargo_version"

      # Installs the toolchain pinned in app/rust-toolchain.toml (no floating `stable`).
      # No build cache on purpose: release binaries are built from a clean slate.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Release build
        run: cargo build --workspace --profile dist --locked

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest $env:INNO_URL -OutFile $exe -MaximumRetryCount 3
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup SHA-256 mismatch: $hash" }
          $dir = "$env:RUNNER_TEMP\innosetup"
          $p = Start-Process $exe -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES',
            '/NORESTART', '/SP-', '/CURRENTUSER', '/NOICONS', "/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          # Its exes report 0.0.0.0 as file version; the uninstall entry has the real one.
          $version = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1').DisplayVersion
          Write-Host "Inno Setup compiler $version"
          if (-not "$version".StartsWith($env:INNO_VERSION)) { throw "unexpected Inno Setup version $version" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Payload defaults to app\target\dist (relative to the .iss file).
          & $env:ISCC /Q "/DAppVersion=$env:VERSION" "/O$(Resolve-Path ..)\dist" ..\installer\mini-launcher.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Package zip and checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          base="mini-launcher-${VERSION}-windows-x86_64"
          mkdir -p "../stage/$base"
          cp target/dist/mini-launcher.exe target/dist/mini-launcher-tray.exe \
            ../LICENSE ../README.md \
            assets/fonts/DepartureMono-OFL.txt "../stage/$base/"
          (cd ../stage && 7z a -tzip -bd "../dist/$base.zip" "$base")
          cd ../dist
          sha256sum --text "$base-setup.exe" "$base.zip" > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - name: Test silent install and uninstall
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ../installer/test-install.ps1 -Setup "../dist/mini-launcher-$env:VERSION-windows-x86_64-setup.exe" -Version $env:VERSION

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x86_64
          path: dist/
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    if: >-
      github.ref_type == 'tag' && startsWith(github.ref_name, 'app-v') &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry-run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-x86_64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict SHA256SUMS)
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "Mini Launcher $TAG"
