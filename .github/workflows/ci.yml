name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mini-launcher-linux-x86_64
            # The tray app is Windows-only for now (a stub elsewhere).
            binaries: app/target/release/mini-launcher
          - os: windows-latest
            artifact: mini-launcher-windows-x86_64
            binaries: |
              app/target/release/mini-launcher.exe
              app/target/release/mini-launcher-tray.exe
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain pinned in app/rust-toolchain.toml (no floating `stable`).
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Install libudev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --workspace --release --locked

      # Fails unless both exes carry an icon group resource (RT_GROUP_ICON)
      # embedded by app/cli/build.rs; the tray also loads it at runtime.
      - name: Check exe icon resource (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PeIcons {
              delegate bool EnumNameProc(IntPtr module, IntPtr type, IntPtr name, IntPtr param);
              [DllImport("kernel32", SetLastError = true, CharSet = CharSet.Unicode)]
              static extern IntPtr LoadLibraryExW(string path, IntPtr file, uint flags);
              [DllImport("kernel32", SetLastError = true)]
              static extern bool EnumResourceNamesW(IntPtr module, IntPtr type, EnumNameProc cb, IntPtr param);
              [DllImport("kernel32")]
              static extern bool FreeLibrary(IntPtr module);
              public static int CountIconGroups(string path) {
                  // LOAD_LIBRARY_AS_DATAFILE | LOAD_LIBRARY_AS_IMAGE_RESOURCE
                  IntPtr module = LoadLibraryExW(path, IntPtr.Zero, 0x22);
                  if (module == IntPtr.Zero) throw new System.ComponentModel.Win32Exception();
                  int count = 0;
                  EnumResourceNamesW(module, (IntPtr)14, (m, t, n, p) => { count++; return true; }, IntPtr.Zero);
                  FreeLibrary(module);
                  return count;
              }
          }
          '@
          foreach ($name in 'mini-launcher.exe', 'mini-launcher-tray.exe') {
              $exe = Resolve-Path "target/release/$name"
              $groups = [PeIcons]::CountIconGroups($exe)
              Write-Host "icon groups in ${exe}: $groups"
              if ($groups -lt 1) { throw "$name has no embedded icon" }
          }

      # The tray must not open a console: PE subsystem 2 = Windows GUI.
      - name: Check tray exe is windowless (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path target/release/mini-launcher-tray.exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5c)
          Write-Host "mini-launcher-tray.exe subsystem: $subsystem"
          if ($subsystem -ne 2) { throw "mini-launcher-tray.exe is not a GUI-subsystem exe" }

      # The settings window must give its wgpu device and surface back on close
      # (ADR 0001): open it from the tray, close it, and check the tray lives on.
      # Prints private memory idle / window open / after close for the PR.
      # While it is open, the tray's own window must live on another thread and
      # keep answering messages (the tray loop is never blocked by the window).
      - name: Settings window open/close memory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MINI_LAUNCHER_LOG_DIR: ${{ runner.temp }}/tray-logs
        run: |
          $exe = Resolve-Path target/release/mini-launcher-tray.exe
          function Mem($p) {
              $p.Refresh()
              '{0,6:N1} MiB private, {1,6:N1} MiB working set' -f ($p.PrivateMemorySize64 / 1MB), ($p.WorkingSet64 / 1MB)
          }
          Add-Type -Path ../.github/ci/TrayWindows.cs
          try {
              $idle = Start-Process $exe -PassThru
              Start-Sleep 5
              Write-Host "tray idle (no window): $(Mem $idle)"
              Stop-Process $idle; $idle.WaitForExit()

              # Two opens: the second checks eframe's kept event loop can reopen
              # the window and that memory doesn't climb across cycles. The tray
              # reopens at once, so "after close" is only measurable after the last.
              $p = Start-Process $exe -ArgumentList '--settings', '--settings' -PassThru
              # The tray's own "settings window closed" log lines.
              function Closed { @(Get-ChildItem $env:MINI_LAUNCHER_LOG_DIR -File -ErrorAction SilentlyContinue | Select-String 'settings window closed').Count }
              $prev = [IntPtr]::Zero
              foreach ($cycle in 1, 2) {
                  # Wait for a window that is not the previous cycle's (which
                  # MainWindowHandle can still name while it is going away).
                  $hwnd = [IntPtr]::Zero
                  for ($i = 0; $i -lt 60; $i++) {
                      $hwnd = [TrayThreads]::SettingsWindow($p.Id)
                      if ($hwnd -ne [IntPtr]::Zero -and $hwnd -ne $prev) { break }
                      Start-Sleep -Milliseconds 500
                  }
                  if ($hwnd -eq [IntPtr]::Zero -or $hwnd -eq $prev) { throw "the settings window did not open (cycle $cycle)" }
                  $prev = $hwnd
                  Write-Host "cycle ${cycle}: settings window $([TrayThreads]::Describe($hwnd))"
                  $p.Refresh(); Write-Host "cycle ${cycle}: MainWindowHandle $([TrayThreads]::Describe($p.MainWindowHandle))"
                  Start-Sleep 3
                  Write-Host "cycle ${cycle}: window open:  $(Mem $p)"
                  $tray = [TrayThreads]::TrayWindow($p.Id)
                  if ($tray -eq [IntPtr]::Zero) { throw "the tray's window was not found" }
                  $trayThread = [TrayThreads]::Thread($tray)
                  $windowThread = [TrayThreads]::Thread($hwnd)
                  Write-Host "cycle ${cycle}: tray thread $trayThread, settings window thread $windowThread"
                  if ($trayThread -eq $windowThread) { throw "the settings window runs on the tray's thread" }
                  if (-not [TrayThreads]::Responds($tray)) { throw "the tray stopped answering while the window is open" }
                  # Close this window and wait for the tray to log it; retry
                  # if the request was not delivered or not acted on.
                  $done = $false
                  for ($try = 1; $try -le 5 -and -not $done; $try++) {
                      if (-not [TrayThreads]::Close($hwnd)) { Write-Host "cycle ${cycle}: WM_CLOSE not posted (try $try)" }
                      for ($i = 0; $i -lt 20; $i++) {
                          if ((Closed) -ge $cycle) { $done = $true; break }
                          Start-Sleep -Milliseconds 500
                      }
                      if (-not $done) { Write-Host "cycle ${cycle}: close not logged within 10 s (try $try)" }
                  }
                  if (-not $done) { throw "the settings window did not close (cycle $cycle)" }
                  if ($p.HasExited) { throw "the tray exited (code $($p.ExitCode)) when the window closed" }
              }
              # The window's wgpu device and surface are released after the
              # close is logged: wait for the memory to come back down.
              $watch = [Diagnostics.Stopwatch]::StartNew()
              do {
                  Start-Sleep -Milliseconds 250; $p.Refresh()
              } while ($p.PrivateMemorySize64 -ge 40MB -and $watch.Elapsed.TotalSeconds -lt 15)
              Write-Host ("after both closed:      $(Mem $p) (after {0:N1} s)" -f $watch.Elapsed.TotalSeconds)
              if ($p.PrivateMemorySize64 -ge 40MB) { throw "private memory still at or above 40 MiB 15 s after the window closed" }
              $closed = Closed
              if ($closed -ne 2) { throw "expected 2 'settings window closed' log lines, found $closed" }
              Stop-Process $p
          } finally {
              Get-ChildItem $env:MINI_LAUNCHER_LOG_DIR -File -ErrorAction SilentlyContinue | Get-Content
          }

      # Regression test for #88: a close must always end the window's loop,
      # whatever the timing, so Settings… can open the window again.
      - name: Settings window open/close stress (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MINI_LAUNCHER_LOG_DIR: ${{ runner.temp }}/tray-stress-logs
        run: |
          Add-Type -Path ../.github/ci/TrayWindows.cs
          $cycles = 20
          $exe = Resolve-Path target/release/mini-launcher-tray.exe
          # One --settings per opening: the tray reopens the window as soon as
          # the previous one has closed (what Settings… does).
          $p = Start-Process $exe -ArgumentList (@('--settings') * $cycles) -PassThru
          function Closed { @(Get-ChildItem $env:MINI_LAUNCHER_LOG_DIR -File -ErrorAction SilentlyContinue | Select-String 'settings window closed').Count }
          try {
              $prev = [IntPtr]::Zero
              for ($cycle = 1; $cycle -le $cycles; $cycle++) {
                  $hwnd = [IntPtr]::Zero
                  $watch = [Diagnostics.Stopwatch]::StartNew()
                  while ($watch.Elapsed.TotalSeconds -lt 30) {
                      $hwnd = [TrayThreads]::SettingsWindow($p.Id)
                      if ($hwnd -ne [IntPtr]::Zero -and $hwnd -ne $prev) { break }
                      Start-Sleep -Milliseconds 50
                  }
                  if ($hwnd -eq [IntPtr]::Zero -or $hwnd -eq $prev) { throw "the settings window did not (re)open (cycle $cycle)" }
                  $prev = $hwnd
                  $delay = Get-Random -Minimum 0 -Maximum 1501
                  Start-Sleep -Milliseconds $delay
                  if (-not [TrayThreads]::Close($hwnd)) { throw "WM_CLOSE not posted (cycle $cycle)" }
                  $watch.Restart()
                  while ((Closed) -lt $cycle -and $watch.Elapsed.TotalSeconds -lt 5) { Start-Sleep -Milliseconds 50 }
                  if ((Closed) -lt $cycle) { throw "close not logged within 5 s (cycle $cycle, closed after $delay ms)" }
                  Write-Host ("cycle {0,2}: closed after {1,4} ms open, logged in {2:N2} s" -f $cycle, $delay, $watch.Elapsed.TotalSeconds)
                  if ($p.HasExited) { throw "the tray exited (code $($p.ExitCode)) (cycle $cycle)" }
              }
              $watch = [Diagnostics.Stopwatch]::StartNew()
              do {
                  Start-Sleep -Milliseconds 250; $p.Refresh()
              } while ($p.PrivateMemorySize64 -ge 40MB -and $watch.Elapsed.TotalSeconds -lt 15)
              Write-Host ("after {0} cycles: {1:N1} MiB private" -f $cycles, ($p.PrivateMemorySize64 / 1MB))
              # How often the close race (#88) really happened (informational, #90).
              $nudged = @(Get-ChildItem $env:MINI_LAUNCHER_LOG_DIR -File -ErrorAction SilentlyContinue | Select-String 'settings window close needed \d+ wake-ups').Count
              Write-Host "closes that needed a wake-up: $nudged of $cycles"
              if ($p.PrivateMemorySize64 -ge 40MB) { throw "private memory still at or above 40 MiB 15 s after the last close" }
          } finally {
              if (-not $p.HasExited) { Stop-Process $p -ErrorAction SilentlyContinue }
              Get-ChildItem $env:MINI_LAUNCHER_LOG_DIR -File -ErrorAction SilentlyContinue | Get-Content -Tail 60
          }

      # `--quit` (what setup does before an upgrade): quits an idle tray, never
      # one with Settings open (it may hold unsaved edits), and is a no-op when
      # nothing runs. Exit code 0 = nothing running any more, 1 = still running.
      - name: Tray --quit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MINI_LAUNCHER_LOG_DIR: ${{ runner.temp }}/tray-quit-logs
        run: |
          Add-Type -Path ../.github/ci/TrayWindows.cs
          $exe = Resolve-Path target/release/mini-launcher-tray.exe
          function Quit {
              $q = Start-Process $exe -ArgumentList '--quit' -PassThru
              $null = $q.Handle  # keeps ExitCode readable after exit
              $q.WaitForExit(); $q.ExitCode
          }
          try {
              if ((Quit) -ne 0) { throw "--quit with nothing running did not exit 0" }
              $p = Start-Process $exe -PassThru
              Start-Sleep 3
              if ((Quit) -ne 0) { throw "--quit did not report the idle tray gone" }
              if (-not $p.WaitForExit(5000)) { throw "the idle tray did not quit" }
              $p = Start-Process $exe -ArgumentList '--settings' -PassThru
              $hwnd = [IntPtr]::Zero
              for ($i = 0; $i -lt 60 -and $hwnd -eq [IntPtr]::Zero; $i++) {
                  Start-Sleep -Milliseconds 500; $hwnd = [TrayThreads]::SettingsWindow($p.Id)
              }
              if ($hwnd -eq [IntPtr]::Zero) { throw "the settings window did not open" }
              if ((Quit) -ne 1) { throw "--quit with Settings open did not exit 1" }
              if ($p.HasExited) { throw "the tray quit while Settings was open" }
              if ([TrayThreads]::SettingsWindow($p.Id) -eq [IntPtr]::Zero) { throw "the settings window closed" }
              [void][TrayThreads]::Close($hwnd)
              for ($i = 0; $i -lt 20 -and [TrayThreads]::SettingsWindow($p.Id) -ne [IntPtr]::Zero; $i++) { Start-Sleep -Milliseconds 500 }
              if ((Quit) -ne 0) { throw "--quit after Settings closed did not exit 0" }
              if (-not $p.WaitForExit(5000)) { throw "the tray did not quit after Settings closed" }
          } finally {
              if ($p -and -not $p.HasExited) { Stop-Process $p -ErrorAction SilentlyContinue }
              Get-ChildItem $env:MINI_LAUNCHER_LOG_DIR -File -ErrorAction SilentlyContinue | Get-Content -Tail 40
          }

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binaries }}
          if-no-files-found: error
