name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mini-launcher-linux-x86_64
            # The tray app is Windows-only for now (a stub elsewhere).
            binaries: app/target/release/mini-launcher
          - os: windows-latest
            artifact: mini-launcher-windows-x86_64
            binaries: |
              app/target/release/mini-launcher.exe
              app/target/release/mini-launcher-tray.exe
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain pinned in app/rust-toolchain.toml (no floating `stable`).
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Install libudev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --workspace --release --locked

      # Fails unless both exes carry an icon group resource (RT_GROUP_ICON)
      # embedded by app/cli/build.rs; the tray also loads it at runtime.
      - name: Check exe icon resource (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PeIcons {
              delegate bool EnumNameProc(IntPtr module, IntPtr type, IntPtr name, IntPtr param);
              [DllImport("kernel32", SetLastError = true, CharSet = CharSet.Unicode)]
              static extern IntPtr LoadLibraryExW(string path, IntPtr file, uint flags);
              [DllImport("kernel32", SetLastError = true)]
              static extern bool EnumResourceNamesW(IntPtr module, IntPtr type, EnumNameProc cb, IntPtr param);
              [DllImport("kernel32")]
              static extern bool FreeLibrary(IntPtr module);
              public static int CountIconGroups(string path) {
                  // LOAD_LIBRARY_AS_DATAFILE | LOAD_LIBRARY_AS_IMAGE_RESOURCE
                  IntPtr module = LoadLibraryExW(path, IntPtr.Zero, 0x22);
                  if (module == IntPtr.Zero) throw new System.ComponentModel.Win32Exception();
                  int count = 0;
                  EnumResourceNamesW(module, (IntPtr)14, (m, t, n, p) => { count++; return true; }, IntPtr.Zero);
                  FreeLibrary(module);
                  return count;
              }
          }
          '@
          foreach ($name in 'mini-launcher.exe', 'mini-launcher-tray.exe') {
              $exe = Resolve-Path "target/release/$name"
              $groups = [PeIcons]::CountIconGroups($exe)
              Write-Host "icon groups in ${exe}: $groups"
              if ($groups -lt 1) { throw "$name has no embedded icon" }
          }

      # The tray must not open a console: PE subsystem 2 = Windows GUI.
      - name: Check tray exe is windowless (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path target/release/mini-launcher-tray.exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5c)
          Write-Host "mini-launcher-tray.exe subsystem: $subsystem"
          if ($subsystem -ne 2) { throw "mini-launcher-tray.exe is not a GUI-subsystem exe" }

      # The settings window must give its wgpu device and surface back on close
      # (ADR 0001): open it from the tray, close it, and check the tray lives on.
      # Prints private memory idle / window open / after close for the PR.
      # While it is open, the tray's own window must live on another thread and
      # keep answering messages (the tray loop is never blocked by the window).
      - name: Settings window open/close memory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MINI_LAUNCHER_LOG_DIR: ${{ runner.temp }}/tray-logs
        run: |
          $exe = Resolve-Path target/release/mini-launcher-tray.exe
          function Mem($p) {
              $p.Refresh()
              '{0,6:N1} MiB private, {1,6:N1} MiB working set' -f ($p.PrivateMemorySize64 / 1MB), ($p.WorkingSet64 / 1MB)
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class TrayThreads {
              delegate bool EnumProc(IntPtr hwnd, IntPtr param);
              [DllImport("user32")] static extern bool EnumWindows(EnumProc cb, IntPtr param);
              [DllImport("user32")] static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
              [DllImport("user32", CharSet = CharSet.Unicode)] static extern int GetClassNameW(IntPtr hwnd, StringBuilder name, int max);
              [DllImport("user32")] static extern IntPtr SendMessageTimeoutW(IntPtr hwnd, uint msg, IntPtr w, IntPtr l, uint flags, uint ms, out IntPtr result);
              public static IntPtr TrayWindow(int pid) {
                  IntPtr found = IntPtr.Zero;
                  EnumWindows((h, p) => {
                      uint owner; GetWindowThreadProcessId(h, out owner);
                      var name = new StringBuilder(64); GetClassNameW(h, name, 64);
                      if (owner == pid && name.ToString() == "tray_icon_app") { found = h; return false; }
                      return true;
                  }, IntPtr.Zero);
                  return found;
              }
              public static uint Thread(IntPtr hwnd) { uint pid; return GetWindowThreadProcessId(hwnd, out pid); }
              // WM_NULL with SMTO_ABORTIFHUNG; true if the window's thread answered within 2 s.
              public static bool Responds(IntPtr hwnd) { IntPtr r; return SendMessageTimeoutW(hwnd, 0, IntPtr.Zero, IntPtr.Zero, 2, 2000, out r) != IntPtr.Zero; }
              [DllImport("user32")] static extern bool PostMessageW(IntPtr hwnd, uint msg, IntPtr w, IntPtr l);
              // WM_CLOSE to this exact window (not whatever MainWindowHandle names now).
              public static bool Close(IntPtr hwnd) { return PostMessageW(hwnd, 0x0010, IntPtr.Zero, IntPtr.Zero); }
          }
          '@
          try {
              $idle = Start-Process $exe -PassThru
              Start-Sleep 5
              Write-Host "tray idle (no window): $(Mem $idle)"
              Stop-Process $idle; $idle.WaitForExit()

              # Two opens: the second checks eframe's kept event loop can reopen
              # the window and that memory doesn't climb across cycles. The tray
              # reopens at once, so "after close" is only measurable after the last.
              $p = Start-Process $exe -ArgumentList '--settings', '--settings' -PassThru
              # The tray's own "settings window closed" log lines.
              function Closed { @(Get-ChildItem $env:MINI_LAUNCHER_LOG_DIR -File -ErrorAction SilentlyContinue | Select-String 'settings window closed').Count }
              $prev = [IntPtr]::Zero
              foreach ($cycle in 1, 2) {
                  # Wait for a window that is not the previous cycle's (which
                  # MainWindowHandle can still name while it is going away).
                  $hwnd = [IntPtr]::Zero
                  for ($i = 0; $i -lt 60; $i++) {
                      $p.Refresh(); $hwnd = $p.MainWindowHandle
                      if ($hwnd -ne [IntPtr]::Zero -and $hwnd -ne $prev) { break }
                      Start-Sleep -Milliseconds 500
                  }
                  if ($hwnd -eq [IntPtr]::Zero -or $hwnd -eq $prev) { throw "the settings window did not open (cycle $cycle)" }
                  $prev = $hwnd
                  Start-Sleep 3
                  Write-Host "cycle ${cycle}: window open:  $(Mem $p)"
                  $tray = [TrayThreads]::TrayWindow($p.Id)
                  if ($tray -eq [IntPtr]::Zero) { throw "the tray's window was not found" }
                  $trayThread = [TrayThreads]::Thread($tray)
                  $windowThread = [TrayThreads]::Thread($hwnd)
                  Write-Host "cycle ${cycle}: tray thread $trayThread, settings window thread $windowThread"
                  if ($trayThread -eq $windowThread) { throw "the settings window runs on the tray's thread" }
                  if (-not [TrayThreads]::Responds($tray)) { throw "the tray stopped answering while the window is open" }
                  # Close this window and wait for the tray to log it; retry
                  # if the request was not delivered or not acted on.
                  $done = $false
                  for ($try = 1; $try -le 5 -and -not $done; $try++) {
                      if (-not [TrayThreads]::Close($hwnd)) { Write-Host "cycle ${cycle}: WM_CLOSE not posted (try $try)" }
                      for ($i = 0; $i -lt 20; $i++) {
                          if ((Closed) -ge $cycle) { $done = $true; break }
                          Start-Sleep -Milliseconds 500
                      }
                      if (-not $done) { Write-Host "cycle ${cycle}: close not logged within 10 s (try $try)" }
                  }
                  if (-not $done) { throw "the settings window did not close (cycle $cycle)" }
                  if ($p.HasExited) { throw "the tray exited (code $($p.ExitCode)) when the window closed" }
              }
              Start-Sleep 2
              Write-Host "after both closed:      $(Mem $p)"
              $closed = Closed
              if ($closed -ne 2) { throw "expected 2 'settings window closed' log lines, found $closed" }
              Stop-Process $p
          } finally {
              Get-ChildItem $env:MINI_LAUNCHER_LOG_DIR -File -ErrorAction SilentlyContinue | Get-Content
          }

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binaries }}
          if-no-files-found: error
