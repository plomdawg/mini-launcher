name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mini-launcher-linux-x86_64
            binary: mini-launcher
          - os: windows-latest
            artifact: mini-launcher-windows-x86_64
            binary: mini-launcher.exe
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain pinned in app/rust-toolchain.toml (no floating `stable`).
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Install libudev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --workspace --release --locked

      # Fails unless the exe carries an icon group resource (RT_GROUP_ICON)
      # embedded by app/cli/build.rs.
      - name: Check exe icon resource (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PeIcons {
              delegate bool EnumNameProc(IntPtr module, IntPtr type, IntPtr name, IntPtr param);
              [DllImport("kernel32", SetLastError = true, CharSet = CharSet.Unicode)]
              static extern IntPtr LoadLibraryExW(string path, IntPtr file, uint flags);
              [DllImport("kernel32", SetLastError = true)]
              static extern bool EnumResourceNamesW(IntPtr module, IntPtr type, EnumNameProc cb, IntPtr param);
              [DllImport("kernel32")]
              static extern bool FreeLibrary(IntPtr module);
              public static int CountIconGroups(string path) {
                  // LOAD_LIBRARY_AS_DATAFILE | LOAD_LIBRARY_AS_IMAGE_RESOURCE
                  IntPtr module = LoadLibraryExW(path, IntPtr.Zero, 0x22);
                  if (module == IntPtr.Zero) throw new System.ComponentModel.Win32Exception();
                  int count = 0;
                  EnumResourceNamesW(module, (IntPtr)14, (m, t, n, p) => { count++; return true; }, IntPtr.Zero);
                  FreeLibrary(module);
                  return count;
              }
          }
          '@
          $exe = Resolve-Path target/release/mini-launcher.exe
          $groups = [PeIcons]::CountIconGroups($exe)
          Write-Host "icon groups in ${exe}: $groups"
          if ($groups -lt 1) { throw "mini-launcher.exe has no embedded icon" }

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: app/target/release/${{ matrix.binary }}
          if-no-files-found: error
