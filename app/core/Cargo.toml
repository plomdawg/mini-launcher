[package]
name = "mini-launcher-core"
description = "Core library for Mini Launcher: reader, tag parsing, config and launching"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mini_launcher_core"

[dependencies]
crc32fast = "1.5.0"
directories = "6.0.0"
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
serde = { version = "1.0.229", features = ["derive"] }
serialport = { version = "4", default-features = false }
thiserror = "2"
tracing = "0.1"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
