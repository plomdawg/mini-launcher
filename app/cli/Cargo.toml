[package]
name = "mini-launcher-cli"
description = "Command-line front end for Mini Launcher"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mini_launcher_cli"
path = "src/lib.rs"

[[bin]]
name = "mini-launcher"
path = "src/main.rs"

# Windowless tray app. Windows-only for now: elsewhere it only prints a
# pointer to `mini-launcher run`, so Linux CI needs no GTK packages.
[[bin]]
name = "mini-launcher-tray"
path = "src/tray/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
mini-launcher-core = { path = "../core" }
serialport = { version = "4", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std", "registry"] }

[target.'cfg(windows)'.dependencies]
# The settings window (egui/eframe + wgpu, ADR 0001); only the tray uses it.
mini-launcher-ui = { path = "../ui", features = ["window"] }
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
# Pinned exactly: the tray's balloon notifications rely on how this version
# registers its icon (see src/tray/app.rs). `muda` is its menu crate.
tray-icon = "=0.26.1"
muda = { version = "=0.21.2", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Embeds assets/icon/mini-launcher.ico as the icon of both exes (see build.rs);
# the tray also loads it at runtime as its notification-area icon.
# Build-dependency target cfgs match the host, which is the target for the
# native Windows builds CI and releases use.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
